name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only the dev tools: the GUI and Windows dependencies are not needed,
      # because everything outside commendbot_panel.ui imports on any platform.
      - run: pip install pytest ruff

      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: src
